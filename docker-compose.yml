name: portfolio-v3

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Compose resolves these from the shell and from ./.env, never from env_file.
      # Every value here is baked into the image: changing one needs `--build`.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_SITE_EMAIL: ${NEXT_PUBLIC_SITE_EMAIL:?NEXT_PUBLIC_SITE_EMAIL is required}
        NEXT_PUBLIC_SITE_GITHUB_URL: ${NEXT_PUBLIC_SITE_GITHUB_URL:-}
        NEXT_PUBLIC_SITE_LINKEDIN_URL: ${NEXT_PUBLIC_SITE_LINKEDIN_URL:-}
        NEXT_PUBLIC_USE_RESEND_EMAIL_FORM: ${NEXT_PUBLIC_USE_RESEND_EMAIL_FORM:-false}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-}
    image: portfolio-v3:${IMAGE_TAG:-latest}
    container_name: portfolio_v3_web
    restart: unless-stopped
    # Runtime configuration, including every secret. Nothing here reaches the image.
    env_file:
      - .env
    environment:
      PORT: "3200"
      HOSTNAME: "0.0.0.0"
    # Bound to loopback on purpose: the container serves plain HTTP.
    # To expose it publicly, put a TLS-terminating reverse proxy in front.
    ports:
      - "127.0.0.1:${WEB_PORT:-3200}:3200"
    mem_limit: 512m
    logging: *default-logging
